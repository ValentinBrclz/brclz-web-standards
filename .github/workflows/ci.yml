name: Standards CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Sites use either branch name for production.
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Biome, type check, declaration drift, unit and integration tests.
      - run: npm run verify

  smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Browser step of the smoke test (consent behaviour of the PostHog loader).
      - run: npx playwright install --with-deps chromium
      # Packs this repository, installs it into a fresh Astro project, builds it and checks the
      # output with `wrangler deploy --dry-run` (no Cloudflare credentials, nothing deployed).
      - run: npm run test:smoke

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Static security analysis of the workflows themselves (template injection, permissions).
      - run: pipx run zizmor==1.31.1 --offline .github/workflows
