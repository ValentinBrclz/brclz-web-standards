# Reusable CI for consumer sites. Call it from a site repository with `@main` (always current) or a
# full commit SHA (frozen):
#
#   jobs:
#     standards:
#       uses: ValentinBrclz/brclz-web-standards/.github/workflows/reusable-astro-ci.yml@main
#       with:
#         audit-dist: true
#
# It only reads the repository: no secrets are used and no deployment is performed.
name: Reusable Astro CI

on:
  workflow_call:
    inputs:
      node-version-file:
        description: File holding the Node.js version (.node-version or .nvmrc)
        type: string
        default: .node-version
      working-directory:
        description: Directory containing package.json
        type: string
        default: .
      verify-script:
        description: npm script running lint, type check and tests (empty to skip)
        type: string
        default: verify
      build-script:
        description: npm script producing dist/ (must run brclz generate-headers)
        type: string
        default: build
      site-config:
        description: Path to site.config.mjs, relative to working-directory
        type: string
        default: site.config.mjs
      audit-dist:
        description: Run brclz audit-dist on the build output
        type: boolean
        default: true
      strict:
        description: Treat web-standards warnings as errors
        type: boolean
        default: false
      commitlint:
        description: Lint the pull request title with commitlint (needs commitlint.config.mjs and @commitlint/cli; add `edited` to the caller's pull_request types to re-check renamed titles)
        type: boolean
        default: false
      wrangler-dry-run:
        description: Validate the Wrangler configuration with `wrangler deploy --dry-run` (no credentials)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  astro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SITE_CONFIG: ${{ inputs.site-config }}
      VERIFY_SCRIPT: ${{ inputs.verify-script }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      STRICT: ${{ inputs.strict && '--strict' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci
      - name: Lint pull request title
        if: inputs.commitlint && github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint
      - name: Check site configuration
        run: npx --no-install brclz check --site "$SITE_CONFIG" $STRICT
      - name: Verify
        if: inputs.verify-script != ''
        run: npm run "$VERIFY_SCRIPT"
      - name: Build
        run: npm run "$BUILD_SCRIPT"
      - name: Check generated _headers
        run: |
          test -f dist/_headers || { echo "dist/_headers missing: run brclz generate-headers in the build script"; exit 1; }
          head -n 1 dist/_headers | grep -q 'Generated by @valentinbrclz/web-standards' || { echo "dist/_headers was not generated by web-standards"; exit 1; }
      - name: Audit build output
        if: inputs.audit-dist
        run: npx --no-install brclz audit-dist --site "$SITE_CONFIG" $STRICT
      - name: Wrangler dry run
        if: inputs.wrangler-dry-run
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
