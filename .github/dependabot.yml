# Grouped updates: one weekly PR per group for minor/patch, one PR per major.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      cloudflare:
        patterns: [wrangler, '@cloudflare/*']
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep the Node typings on the supported runtime major (engines.node).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # Versions installed by `brclz init` in new sites.
  - package-ecosystem: npm
    directory: /templates/astro-static
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      cloudflare:
        patterns: [wrangler, '@cloudflare/*']
        update-types: [minor, patch]
      astro:
        patterns: [astro, '@astrojs/*']
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @astrojs/check accepts TypeScript ^5 || ^6 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
