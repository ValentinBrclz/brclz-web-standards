# Synthetic example of a project-owned Wrangler file for examples/multilingual.site.config.mjs.
name = "org-example"
compatibility_date = "2026-10-26"
previews = { }
workers_dev = false
preview_urls = false

[[routes]]
pattern = "www.example.org"
custom_domain = true

[[routes]]
pattern = "dev.example.org"
custom_domain = true
previews_enabled = true
enabled = false

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
